# Free scheduling: GitHub runs this every fifteen minutes (best effort; GitHub
# can delay scheduled runs at busy times) and it asks Nabd to run whatever
# checks are due. Page views and a daily Vercel cron also trigger runs, and the
# work is throttled in the database, so overlapping triggers never double-check.
#
# Why fifteen and not five: Neon's free plan gives a database 100 compute-hours
# a month and puts it to sleep after five idle minutes. A run every five minutes
# would keep it awake around the clock (about 180 hours); every fifteen, it
# sleeps about two thirds of the time. With an always-on database, use */5.
name: Heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run due checks
        env:
          # The NABD_URL repository variable wins; the original repository falls
          # back to its own deployment, and a fork does nothing until it's set.
          NABD_URL: ${{ vars.NABD_URL || (github.repository == 'darkxgs/nabd' && 'https://nabd-status.vercel.app' || '') }}
        run: |
          if [ -z "$NABD_URL" ]; then
            echo "::notice::Set the NABD_URL repository variable (Settings, Variables) to your deployment's address."
            exit 0
          fi
          curl -fsS --max-time 90 --retry 2 "${NABD_URL%/}/api/tick"
